
name: Render Facebook Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Cloudinary secrets
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          test -n "$CLOUD_NAME"
          test -n "$API_KEY"
          test -n "$API_SECRET"
          echo "Cloudinary credentials are configured."

      - name: Check FFmpeg
        run: ffmpeg -version
    
    
      - name: Generate test video
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x14213d:s=1080x1920:r=25:d=15" \
            -f lavfi \
            -i "sine=frequency=440:sample_rate=44100:duration=15" \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -t 15 \
            -movflags +faststart \
            test-reel.mp4

          ls -lh test-reel.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-facebook-reel
          path: test-reel.mp4


