name: Render Facebook Reel

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Facebook page name"
        required: false
        type: string
        default: "Tech Cartoon"
      title:
        description: "Arabic Reel title"
        required: false
        type: string
        default: ""
      description:
        description: "Facebook post description"
        required: false
        type: string
        default: ""
      scenes_json:
        description: "Three scenes generated by Gemini as a JSON array"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install edge-tts pillow arabic-reshaper python-bidi cloudinary requests

      - name: Prepare dynamic content
        env:
          REEL_ACCOUNT: ${{ inputs.account }}
          REEL_TITLE: ${{ inputs.title }}
          REEL_DESCRIPTION: ${{ inputs.description }}
          REEL_SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path('reel_content.json')
          if target.exists():
              target.unlink()  # Prevent stale data during manual demo runs

          raw = os.environ.get('REEL_SCENES_JSON', '').strip()
          if not raw:
              print('No Gemini payload; using manual demo scenes.')
          else:
              scenes = json.loads(raw)
              if not isinstance(scenes, list) or len(scenes) != 3:
                  raise ValueError('Exactly three scenes are required')
              for index, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      raise ValueError(f'Invalid scene {index}')
                  if not isinstance(scene.get('voiceover'), str) or not scene['voiceover'].strip():
                      raise ValueError(f'Missing voiceover in scene {index}')
                  if not isinstance(scene.get('image_prompt'), str) or not scene['image_prompt'].strip():
                      raise ValueError(f'Missing image_prompt in scene {index}')

              payload = {
                  'type': 'video',  # Required by render.py.load_content()
                  'account': os.environ.get('REEL_ACCOUNT') or 'Tech Cartoon',
                  'title': os.environ.get('REEL_TITLE', ''),
                  'description': os.environ.get('REEL_DESCRIPTION', ''),
                  'scenes': scenes,
              }
              target.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              print('Dynamic video payload ready: type=video, scenes=3')
          PY

      - name: Generate AI images with Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python image_generator.py

      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for index in range(1, 4):
              path = Path(f'images/scene{index}.jpg')
              if not path.is_file():
                  raise FileNotFoundError(f'Missing image: {path}')
              with Image.open(path) as image:
                  image.verify()
              print(f'Image verified: {path}')
          PY

      - name: Generate Arabic Reel
        run: |
          python render.py

      - name: Validate video
        run: |
          test -s test-reel.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 test-reel.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 test-reel.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-${{ github.run_id }}
          path: test-reel.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Upload MP4 to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ['CLOUDINARY_CLOUD_NAME'],
              api_key=os.environ['CLOUDINARY_API_KEY'],
              api_secret=os.environ['CLOUDINARY_API_SECRET'],
              secure=True,
          )
          result = cloudinary.uploader.upload(
              'test-reel.mp4',
              resource_type='video',
              folder='facebook-reels',
              public_id=f"reel-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}",
              overwrite=False,
              timeout=120,
          )
          video_url = result.get('secure_url')
          if not video_url or not video_url.startswith('https://'):
              raise RuntimeError('Invalid Cloudinary video URL')
          print('Upload successful!')
          print('Video URL:', video_url)
          print('Public ID:', result.get('public_id'))
          PY
