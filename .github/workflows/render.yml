
name: Render Facebook Reel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Cloudinary secrets
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          test -n "$CLOUD_NAME" || exit 1
          test -n "$API_KEY" || exit 1
          test -n "$API_SECRET" || exit 1
          echo "Cloudinary credentials configured."

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      
      
      
      - name: Generate animated AI scene
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x081a33:s=1080x1920:r=25" \
            -i narration.mp3 \
            -filter_complex "
              [0:v]drawgrid=w=110:h=110:t=2:c=0x18aaff@0.20,
              drawbox=x='540+250*sin(t)':y='900+200*cos(t)':w=120:h=120:color=0x00ddff@0.8:t=fill,
              drawbox=x='400+160*cos(t*1.3)':y='650+220*sin(t*0.8)':w=70:h=70:color=0x5a7bff@0.7:t=fill,
              drawbox=x='300+100*sin(t*0.7)':y='1200+100*cos(t)':w=90:h=90:color=0x00ffaa@0.6:t=fill,
              format=yuv420p[v]
            " \
            -map "[v]" \
            -map 1:a \
            -c:v libx264 \
            -preset ultrafast \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            test-reel.mp4

          test -s test-reel.mp4



      
      - name: Generate video with Arabic narration
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x14213d:s=1080x1920:r=25" \
            -i narration.mp3 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            test-reel.mp4

          test -s test-reel.mp4


      - name: Validate MP4
        run: |
          test -s test-reel.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

          echo "MP4 validation completed."

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-facebook-reel-${{ github.run_id }}
          path: test-reel.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Install Cloudinary SDK
        run: |
          python -m pip install --quiet cloudinary

      - name: Upload MP4 to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"],
              secure=True
          )

          public_id = (
              "test-reel-"
              + os.environ["RUN_ID"]
              + "-"
              + os.environ["RUN_ATTEMPT"]
          )

          result = cloudinary.uploader.upload(
              "test-reel.mp4",
              resource_type="video",
              folder="facebook-reels",
              public_id=public_id,
              overwrite=False,
              timeout=120
          )

          video_url = result.get("secure_url")

          if not video_url or not video_url.startswith("https://"):
              raise RuntimeError(
                  "Cloudinary did not return a valid HTTPS URL"
              )

          print("Upload successful!")
          print("Video URL:", video_url)
          print("Public ID:", result.get("public_id"))
          PY
