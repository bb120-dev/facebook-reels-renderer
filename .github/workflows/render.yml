
name: Render Facebook Reel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-noto-core

          python -m pip install \
            edge-tts \
            pillow \
            arabic-reshaper \
            python-bidi \
            cloudinary \
            requests

      # 3. Generate AI scene images
      - name: Generate AI images with Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python image_generator.py

      # 4. Verify generated images
      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for i in range(1, 4):
              path = Path(f"images/scene{i}.jpg")

              if not path.exists():
                  raise FileNotFoundError(
                      f"Missing image: {path}"
                  )

              with Image.open(path) as img:
                  img.verify()

              print(f"Image {i} validated: {path}")
          PY

      # 5. Generate Arabic video
      - name: Generate Arabic Reel
        run: |
          python render.py

      # 6. Validate MP4
      - name: Validate video
        run: |
          test -s test-reel.mp4

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

      # 7. Upload video artifact
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-${{ github.run_id }}
          path: test-reel.mp4
          retention-days: 7
          if-no-files-found: error

      # 8. Upload MP4 to Cloudinary
      - name: Upload MP4 to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"],
              secure=True,
          )

          result = cloudinary.uploader.upload(
              "test-reel.mp4",
              resource_type="video",
              folder="facebook-reels",
              public_id=(
                  "reel-"
                  + os.environ["RUN_ID"]
                  + "-"
                  + os.environ["RUN_ATTEMPT"]
              ),
              overwrite=False,
              timeout=120,
          )

          video_url = result.get("secure_url")

          if not video_url or not video_url.startswith("https://"):
              raise RuntimeError(
                  "Invalid Cloudinary video URL"
              )

          print("Upload successful!")
          print("Video URL:", video_url)
          print("Public ID:", result.get("public_id"))
          PY
