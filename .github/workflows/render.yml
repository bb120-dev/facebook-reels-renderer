
name: Render Facebook Reel

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Facebook page name"
        required: false
        type: string
        default: "تك كارتون"

      title:
        description: "Arabic Reel title"
        required: false
        type: string
        default: ""

      description:
        description: "Facebook post description"
        required: false
        type: string
        default: ""

      scenes_json:
        description: "Three scenes generated by Gemini"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-noto-core

          python -m pip install \
            edge-tts \
            pillow \
            arabic-reshaper \
            python-bidi \
            cloudinary \
            requests

      # 3. Prepare Gemini content
      - name: Prepare dynamic content
        env:
          REEL_ACCOUNT: ${{ inputs.account }}
          REEL_TITLE: ${{ inputs.title }}
          REEL_DESCRIPTION: ${{ inputs.description }}
          REEL_SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get(
              "REEL_SCENES_JSON", ""
          ).strip()

          if raw:
              scenes = json.loads(raw)

              if (
                  not isinstance(scenes, list)
                  or len(scenes) != 3
              ):
                  raise ValueError(
                      "Exactly three scenes are required"
                  )

              for index, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      raise ValueError(
                          f"Invalid scene {index}"
                      )

                  if not scene.get("voiceover"):
                      raise ValueError(
                          f"Missing voiceover in scene {index}"
                      )

                  if not scene.get("image_prompt"):
                      raise ValueError(
                          f"Missing image_prompt in scene {index}"
                      )

              payload = {
                  "account": os.environ.get(
                      "REEL_ACCOUNT", "تك كارتون"
                  ),
                  "title": os.environ.get(
                      "REEL_TITLE", ""
                  ),
                  "description": os.environ.get(
                      "REEL_DESCRIPTION", ""
                  ),
                  "scenes": scenes,
              }

              Path("reel_content.json").write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8",
              )

              print(
                  "Dynamic Gemini content prepared."
              )
          else:
              print(
                  "No dynamic content supplied. "
                  "Using default scene configuration."
              )
          PY

      # 4. Generate images using Cloudflare AI
      - name: Generate AI images with Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -f reel_content.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("reel_content.json").read_text(
                  encoding="utf-8"
              )
          )

          prompts = [
              scene["image_prompt"]
              for scene in data["scenes"]
          ]

          Path("scene_prompts.json").write_text(
              json.dumps(
                  {"prompts": prompts},
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Dynamic image prompts prepared.")
          PY
          fi

          python image_generator.py \
            --prompts-file scene_prompts.json

      # 5. Validate images
      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for i in range(1, 4):
              path = Path(
                  f"images/scene{i}.jpg"
              )

              if not path.is_file():
                  raise FileNotFoundError(
                      f"Missing image: {path}"
                  )

              with Image.open(path) as img:
                  img.verify()

              print(f"Validated: {path}")
          PY

      # 6. Render Arabic video
      - name: Generate Arabic Reel
        run: |
          python render.py

      # 7. Validate final video
      - name: Validate video
        run: |
          test -s test-reel.mp4

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

      # 8. Save video as GitHub artifact
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-${{ github.run_id }}
          path: test-reel.mp4
          retention-days: 7
          if-no-files-found: error

      # 9. Upload video to Cloudinary
      - name: Upload MP4 to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ[
                  "CLOUDINARY_CLOUD_NAME"
              ],
              api_key=os.environ[
                  "CLOUDINARY_API_KEY"
              ],
              api_secret=os.environ[
                  "CLOUDINARY_API_SECRET"
              ],
              secure=True,
          )

          result = cloudinary.uploader.upload(
              "test-reel.mp4",
              resource_type="video",
              folder="facebook-reels",
              public_id=(
                  "reel-"
                  + os.environ["RUN_ID"]
                  + "-"
                  + os.environ["RUN_ATTEMPT"]
              ),
              overwrite=False,
              timeout=120,
          )

          video_url = result.get("secure_url")

          if (
              not video_url
              or not video_url.startswith("https://")
          ):
              raise RuntimeError(
                  "Invalid Cloudinary video URL"
              )

          print("Upload successful!")
          print("Video URL:", video_url)
          print(
              "Public ID:",
              result.get("public_id")
          )
          PY
