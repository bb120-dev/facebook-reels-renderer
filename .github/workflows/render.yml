
name: Render Facebook Reel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

          python -m pip install \
            edge-tts \
            pillow \
            arabic-reshaper \
            python-bidi \
            cloudinary

      - name: Generate Arabic Reel
        run: |
          python render.py

      - name: Validate video
        run: |
          test -s test-reel.mp4

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            test-reel.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-${{ github.run_id }}
          path: test-reel.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Upload MP4 to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"],
              secure=True,
          )

          result = cloudinary.uploader.upload(
              "test-reel.mp4",
              resource_type="video",
              folder="facebook-reels",
              public_id=(
                  "reel-"
                  + os.environ["RUN_ID"]
                  + "-"
                  + os.environ["RUN_ATTEMPT"]
              ),
              overwrite=False,
              timeout=120,
          )

          video_url = result.get("secure_url")

          if not video_url or not video_url.startswith("https://"):
              raise RuntimeError("Invalid Cloudinary video URL")

          print("Upload successful!")
          print("Video URL:", video_url)
          print("Public ID:", result.get("public_id"))
          PY
